<style>
/* VOICE: amigável, calmo, nunca acusatório — segue o mockup Veri+ do time.
   IDEA: app de celular de verdade, igual às 8 telas do mockup.
   PICTURE: o próprio app; o ícone flutuante (escudo) é a peça central.
   COLOUR and TYPE: lilás #efeafd, roxo #5b3fd9, verde/amarelo/vermelho só para status; Plus Jakarta Sans.
   LAYOUT: Início · Aprender · Histórico · Configurações, com telas internas empilhadas. */
:root{color-scheme:light;--bg:#efeafd;--app:#f7f5ff;--card:#fff;--ink:#17142b;--mut:#45415f;--line:#e6e1f7;
--pu:#4528c0;--pu2:#5b3fd9;--pul:#ece6ff;--ok:#15803d;--okl:#dcfce7;--warn:#b45309;--warnl:#fff4d1;--bad:#dc2647;--badl:#ffe1e6;--neu:#6b7280;--neul:#eceef2;--fs:16px}
:root.hc{--ink:#000;--mut:#222;--line:#000;--card:#fff;--app:#fff;--pu:#3a1fb8}
:root.cb{--ok:#1f6fd1;--okl:#dbeafe;--bad:#d1661f;--badl:#ffe8d6}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Plus Jakarta Sans",system-ui,sans-serif;overflow-x:clip}
button,input{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--pu);outline-offset:2px}
.stage{min-height:100vh;display:grid;place-items:center;padding:24px 12px}
.phone{width:min(400px,100%);height:min(840px,calc(100vh - 48px));min-height:640px;background:var(--app);border-radius:44px;border:10px solid #17142b;position:relative;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 30px 60px -25px rgba(70,40,170,.45)}

.scr{flex:1;overflow-y:auto;padding:4px 18px 170px;position:relative}.scr.asc{padding-bottom:96px}
.nav{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1px solid var(--line);padding:6px 4px 10px;z-index:4}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--mut);min-height:52px;padding-top:4px}
.nav button svg{width:24px;height:24px}
.nav button[aria-current=page]{color:var(--pu)}
.nav button[aria-current=page] .nb{background:var(--pu);color:#fff;border-radius:9px;padding:2px}
/* home */
.hd{display:flex;align-items:center;justify-content:space-between;margin:6px 0 14px}
.logo{display:flex;align-items:center;gap:8px}
.logo b{font-size:24px;font-weight:800;letter-spacing:-.5px}.logo b span{color:var(--pu)}
.logo small{display:block;font-size:11px;color:var(--mut);margin-top:-4px}
.av{width:44px;height:44px;border-radius:50%;border:0;background:var(--pul);display:grid;place-items:center;color:var(--pu)}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:16px;padding:6px 6px 6px 14px;box-shadow:0 2px 10px rgba(70,40,170,.08)}

.ib{width:44px;height:44px;border:0;border-radius:12px;background:none;color:var(--pu);display:grid;place-items:center}
.ib svg{width:22px;height:22px}.ib.on{background:var(--pu);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;margin:14px -18px 4px;padding:0 18px 4px;scrollbar-width:none}
.chip{flex:none;border:0;border-radius:99px;padding:8px 14px;font-size:14px;font-weight:600;background:var(--card);color:var(--ink);min-height:44px}
.chip[aria-pressed=true]{background:var(--pu);color:#fff}
.post{background:var(--card);border-radius:20px;overflow:hidden;margin-top:14px;box-shadow:0 2px 12px rgba(70,40,170,.07);position:relative;border:0;padding:0;width:100%;text-align:left;display:block}

.post .tx{padding:12px 14px 14px}

.vchip{position:absolute;right:12px;top:108px;background:#fff;color:var(--pu);font-weight:700;font-size:13px;border-radius:99px;padding:6px 12px;box-shadow:0 4px 12px rgba(0,0,0,.15)}

.sharecard{border:2px solid var(--line);border-radius:16px;padding:14px;margin:0 0 12px;background:var(--app)}

.sharecard .sc-chip{display:inline-flex;gap:4px;align-items:center;font-size:13px;font-weight:700;padding:4px 10px;border-radius:9px;margin-right:8px}.sharecard .sc-chip svg{width:14px;height:14px}
.sharecard .sc-chip.c-ok{background:var(--okl);color:var(--ok)}.sharecard .sc-chip.c-warn{background:var(--warnl);color:var(--warn)}.sharecard .sc-chip.c-bad{background:var(--badl);color:var(--bad)}.sharecard .sc-chip.c-neu{background:var(--neul);color:#4b5563}
.sharecard .sc-cert{font-size:13px;color:var(--mut)}.sharecard .sc-h{font-size:12px;font-weight:800;color:var(--mut);margin-top:10px!important;text-transform:uppercase;letter-spacing:.02em}
.sharecard .sc-t{font-size:14px;line-height:1.4;color:var(--ink)}.sharecard .sc-link{color:var(--pu)!important;overflow-wrap:anywhere;font-size:12px!important}
.sharecard .sc-f{margin:2px 0 0;padding-left:16px;font-size:13px;line-height:1.35}.sharecard .sc-f li{margin:3px 0}.sharecard .sc-f span{color:var(--mut)}.sharecard .sc-foot{font-size:12px;color:var(--mut);margin-top:10px!important}
.facil{background:var(--card);border:3px solid var(--pu2);border-radius:16px;padding:12px 14px;margin:10px 0}
.facil .fh{font-size:13px;font-weight:800;color:var(--pu);margin:0 0 4px}
.facil ul{list-style:none;margin:0;padding:0}.facil li{display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:start;font-size:20px;line-height:1.45;font-weight:600;color:var(--ink);padding:6px 0;border-top:1px solid var(--line)}

.agent{text-align:left}.ag-h{display:flex;gap:10px;align-items:center;font-size:17px}.ag-q{font-size:14px;margin:10px 0 6px!important;color:var(--ink)!important;font-style:italic}
.ag{list-style:none;margin:0;padding:0}.ag li{display:grid;grid-template-columns:24px 1fr;gap:8px;align-items:center;padding:7px 0;font-size:14px;color:var(--mut);border-top:1px solid var(--line)}
.ag li::before{content:"";width:18px;height:18px;border-radius:50%;border:2px solid var(--line)}
.ag li.done{color:var(--ink);font-weight:600}.ag li.done::before{content:"✓";border-color:var(--ok);background:var(--ok);color:#fff;font-size:12px;display:grid;place-items:center}
.a11yb{position:absolute;left:16px;bottom:84px;width:56px;height:56px;border-radius:50%;border:3px solid var(--pu);background:var(--card);color:var(--pu);display:grid;place-items:center;z-index:5;box-shadow:0 8px 20px rgba(70,40,170,.25)}
.a11yb svg{width:30px;height:30px}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:left}.qa button{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:12px;min-height:64px;font-weight:700;display:flex;gap:8px;align-items:center}

.civ{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:18px;padding:14px;margin:0 0 10px;font:inherit;color:var(--ink);min-height:44px}

.civtx p{margin:0 0 12px;line-height:1.55;font-size:16px}.perto{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:14px;margin:0 0 10px}.perto h3{font-size:17px;line-height:1.3;margin:0 0 6px}.perto p{margin:0 0 6px;line-height:1.5}.perto p:last-child{margin:0}.perto a{color:var(--pu);font-weight:700;text-decoration:underline;display:inline-block;min-height:24px;padding:2px 0}.civdado{background:var(--pul);border-radius:14px;padding:12px 14px;margin:0 0 14px;font-weight:600;line-height:1.45}

function localFilter(text,conv){const t=text.toLowerCase();const k=KB.find(x=>x.test(t));
 if(k)return{tipo:'factual',kb:k.id,tema:k.tema};
 if(/(acho|insuport|lind|horr[íi]vel|melhor|pior|bonit|chat[oa]|amo|odeio|gosto|feio|massa)/.test(t))return{tipo:'opiniao'};
 if(/(kkk|rsrs|brincadeira)/.test(t))return{tipo:'brincadeira'};
 if(/\?\s*$/.test(text)&&(conv||text.split(/\s+/).length<7))return{tipo:'pergunta'};
 if(text.split(/\s+/).length>=4)return{tipo:'factual',kb:null,afirmacao:text.trim(),tema:'Outros'};
 return{tipo:'outro'}}
async function aiFilter(text,prev){if(!S.sample)return null;
 const prompt=`Você é o filtro de um app brasileiro de checagem (Veri+). Classifique a FRASE (fala transcrita ou texto digitado; pode ter erros).
Contexto anterior: "${prev||''}"
FRASE: "${text}"
Afirmações já verificadas (id: afirmação):
${KB.map(k=>k.id+': '+k.claim).join('\n')}
Regras: opinião, gosto, brincadeira ou pergunta sem afirmação NÃO são factuais. Perguntas do tipo "X é verdade?" contam como factual sobre X. Só use um id se a frase fizer a MESMA afirmação (pode ser paráfrase). Não julgue se é verdade.
Responda só JSON: {"tipo":"factual|opiniao|pergunta|brincadeira|outro","kb":"id ou null","afirmacao":"afirmação clara e neutra, ou vazio","tema":"Eleições|Saúde|Educação|Segurança|Transporte|Outros","onde_checar":"tipo de fonte primária que poderia confirmar, ou vazio"}`;
 try{const ac=new AbortController();const to=setTimeout(()=>ac.abort(),9000);const r=await S.sample.json(prompt,{modelTier:'quick',signal:ac.signal});clearTimeout(to);
  if(r&&r.tipo){if(r.kb&&!KB.find(k=>k.id===r.kb))r.kb=null;return r}}catch(e){if(e&&e.code==='not_granted')S.sample=null}return null}
async function analyze(text,{prev='',force=false,conv=false}={}){
 text=text.trim();if(!text)return null;
 let f=null;const loc=localFilter(text,conv);
 if(force)f=loc.kb?loc:{tipo:'factual',kb:null,afirmacao:text,tema:'Outros'};
 else{const ai=await aiFilter(text,prev);f=ai||loc;if(ai&&!ai.kb&&loc.kb)f=loc}
 if(f.tipo!=='factual')return{skip:f.tipo};
 const k=KB.find(x=>x.id===f.kb);const rep=k&&S.seen[k.id];if(k){S.seen[k.id]=1;S.learn[k.desinfo]=(S.learn[k.desinfo]||0)+1}
 const r={id:'r'+Date.now()+Math.floor(Math.random()*1e4),kb:k?k.id:null,trecho:text,prev,claim:k?k.claim:(f.afirmacao||text),v:k?k.v:'naoverificavel',tema:f.tema||'Outros',rep:!!rep,onde:f.onde_checar||'',at:new Date()};
 if(k)S.res[k.id]=r;S.hist.unshift(r);return r}

async function gModels(key){if(GMODELS)return GMODELS;let ms=[];try{const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200&key='+encodeURIComponent(key));const j=await r.json();ms=(j.models||[]).filter(m=>/flash/.test(m.name)&&!/image|tts|live|audio|embed|thinking|exp/.test(m.name)&&(m.supportedGenerationMethods||[]).includes('generateContent')).map(m=>m.name.replace('models/',''))}catch(e){}
 const v=n=>{const x=n.match(/(\d+(?:\.\d+)?)/);return x?parseFloat(x[1]):0};const pv=n=>/preview/.test(n)?1:0;const lt=n=>/lite/.test(n)?1:0;

async function callModel(model,url,key){const ac=new AbortController();const t=setTimeout(()=>ac.abort(),120000);

 const src=[];((c.groundingMetadata&&c.groundingMetadata.groundingChunks)||[]).forEach(g=>{if(g.web&&g.web.uri&&!src.some(x=>x.t===g.web.title))src.push({u:g.web.uri,t:g.web.title||'Fonte'})});

let W=null;
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)();const o=a.createOscillator(),g=a.createGain();o.frequency.value=880;g.gain.value=.15;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.18);setTimeout(()=>a.close(),400)}catch(e){}}
function welcome(){const ph=$('.phone');let w=$('.wel');if(w)w.remove();w=document.createElement('div');w.className='wel';w.setAttribute('role','dialog');w.setAttribute('aria-modal','true');w.setAttribute('aria-label','Boas-vindas ao Veri+');W={el:w,st:'menu'};
 ph.appendChild(w);wDraw();setTimeout(()=>{const b=w.querySelector('.band');if(b)b.focus()},50);
 w.addEventListener('click',e=>{const b=e.target.closest('[data-w]');if(!b)return;e.stopPropagation();wDo(b.dataset.w)})}
const WBANDS={menu:[['video','Verificar vídeo do YouTube','Em cima'],['civ','Direitos e informações cívicas','No meio'],['mitos','Mitos e verdades','Embaixo']]};
function wSay(){const st=W.st;const sr=' Com leitor de tela, toque duas vezes.';
 if(st==='menu'){const r=W.told?'':W_RESUMO+' ';W.told=true;return r+'Escolha uma opção. Toque em cima da tela para verificar um vídeo do YouTube. No meio, para seus direitos e informações cívicas. Embaixo, para mitos e verdades.'+(S.dict?' Ou toque em Responder falando, no topo, e diga a opção depois do sinal.':'')+' No topo também estão Repetir, Ajustar, Narração do app e Pular.'}
 if(st==='verif')return (S.dict?'Toque em cima da tela e fale a frase depois do sinal.':'')+' Toque no meio para ouvir um exemplo. Toque embaixo para escrever a frase.'+' Para voltar, toque em Voltar, no topo.';
 if(st==='como')return W_COMO+' Toque em cima para verificar uma informação, no meio para ouvir de novo, ou embaixo para voltar às opções.';
 if(st==='ajuste')return 'Ajustes. A primeira opção é a narração por voz, que está '+(S.cfg.narr?'ligada':'desligada')+'. Depois: já uso leitor de tela, letra maior, alto contraste, leitura fácil, legendas e Libras. No fim da tela, o botão Começar.';
 return ''}
function wDraw(){const w=W.el,st=W.st;
 if(st==='tap'){w.innerHTML=`<button class="tap" type="button" data-w="start">${ic(P.shield,1.8)}<h1>Bem-vindo ao Veri+</h1><p>Verifique. Participe.</p><span class="tapcta">Toque em qualquer lugar da tela para começar</span><small>Com leitor de tela, toque duas vezes.</small></button>`;w.querySelector('.tap').focus();return}
 const top=`<div class="wtop">${st==='menu'?'':`<button data-w="menu" type="button">Voltar</button>`}<button data-w="repetir" type="button">Repetir</button>${S.dict?`<button data-w="ouvir" type="button" class="${W.listen?'on':''}">${W.listen?'Ouvindo…':'Responder falando'}</button>`:''}${st==='menu'?`<button data-w="ajuste" type="button">Ajustar</button>`:''}${st==='menu'?`<button data-w="o-narr" type="button" aria-pressed="${!!S.cfg.narr}">Narração do app: ${S.cfg.narr?'ligada':'desligada'}</button>`:''}<button data-w="go" type="button">Pular</button></div>`;
 if(st==='ajuste'){const on=k=>k==='fs'?S.cfg.fs>16:!!S.cfg[k];
  w.innerHTML=`${top}<div class="st2"><h1>Ajustar o app para mim</h1><p>Dá para mudar depois, em qualquer tela, no botão de acessibilidade.</p>${WOPTS.map(([k,l,d])=>`<button class="wo" data-w="o-${k}" aria-pressed="${on(k)}" type="button"><span>${l}${d?`<small>${d}</small>`:''}</span><b>${on(k)?'Ligado':'Desligado'}</b></button>`).join('')}<button class="go" data-w="go" type="button">Começar</button></div>`;return}
 const tt={menu:'Escolha uma opção'}[st];
  const sub={menu:'Verifique vídeos do YouTube e conheça seus direitos, com fonte oficial.',verif:'Fale, ouça um exemplo ou escreva.',como:'Você manda a informação. O agente procura em fontes oficiais. Você ouve o resultado e o porquê.'}[st];
 w.innerHTML=`${top}<div class="whd"><h1>${tt}</h1><p>${sub}</p>${W.heard?`<p class="heard" role="status">Ouvi: “${esc(W.heard)}”</p>`:''}</div><div class="bands">${WBANDS[st].filter(b=>b[0]!==null||S.dict).map(([k,l,pos])=>`<button class="band" data-w="${k||'falar'}" type="button"><small>${pos}</small>${l}</button>`).join('')}</div>`}
function wGo(after,to){try{save()}catch(e){}if(W&&W.el)W.el.remove();W=null;S.stack=[];S.nav=to||'inicio';render();if(after)after();else{narrar(telaNarr());const h=$('#scr h1');if(h){h.setAttribute('tabindex','-1');h.focus()}}}
/* Abertura padrão: permanecer na tela inicial. */
function wListen(target){if(!S.dict)return;W.wTarget=target;W.listen=true;wDraw();calar();beep();S.dictTarget='wel';setTimeout(()=>S.dict.start().catch(()=>{W&&(W.listen=false,wDraw())}),250)}
function wVoice(text){if(!W)return;W.listen=false;W.heard=text;const t=text.toLowerCase();
 if(/repet|de novo|ajuda/.test(t)){wDraw();narrar(wSay());return}
 if(/v[ií]deo|youtube|verific/.test(t)){wDo('video');return}
 if(/c[ií]vic|direit|votar|voto|informa/.test(t)){wDo('civ');return}
 if(/perto|institui|associa|projeto/.test(t)){calar();wGo(()=>push({s:'perto'}));return}
 if(/mito|boato|verdade|mentira/.test(t)){wDo('mitos');return}
 if(/aprend|jog|desafio|m[ée]todo/.test(t)){wDo('aprender');return}
 if(/ajust|configur|letra|contraste|libras/.test(t)){wDo('ajuste');return}
 if(/in[ií]cio|pular|come[cç]ar|entrar/.test(t)){wDo('go');return}
 if(/leitor|talkback|voice ?over/.test(t)){wDo('sr');return}
 wDraw();narrar('Não entendi: '+text+'. Diga vídeo, direitos, mitos, aprender, ajustar, ou início.')}
function wDo(k){const w=W.el;
 if(k==='start'){W.st='menu';wDraw();narrar(wSay());const b=w.querySelector('.band');if(b)b.focus();return}
 if(k==='repetir'){narrar(wSay());return}
 if(k==='ouvir'){if(W.listen){S.dict.stop().catch(()=>{});return}wListen('cmd');return}
 if(k==='falar'){wListen('frase');return}
 if(k==='go'){calar();wGo();return}
 if(k==='civ'){calar();wGo();return}
 if(k==='video'){calar();wGo(()=>push({s:'video'}));return}
 if(k==='mitos'){calar();wGo(null,'mitos');return}
 if(k==='aprender'){calar();wGo(null,'aprender');return}
 if(k==='escrever'){wGo(()=>{narrar('Escreva a frase no campo de busca, no topo da tela, e toque em Verificar.');const f=$('#q');if(f)f.focus()});return}
 if(k==='exemplo'){const ex=KB.find(x=>x.id==='acompanhante');narrar('Exemplo: alguém mandou no grupo que pessoa com deficiência não pode levar acompanhante na cabine de votação. Vamos verificar.');setTimeout(()=>wGo(()=>checkFlow(ex.claim,{force:true})),300);return}
 if(k==='sr'){S.cfg.sr=!S.cfg.sr;S.cfg.narr=!S.cfg.sr;a11y();wDraw();if(S.cfg.narr)narrar('Narração ligada.');else{calar();falarNav('Narração desligada. Seu leitor de tela continua funcionando.')}const b=w.querySelector('[data-w=sr]');if(b)b.focus();return}
 if(k.startsWith('o-')){const o=k.slice(2);if(o==='sr'){S.cfg.sr=!S.cfg.sr;S.cfg.narr=!S.cfg.sr}else if(o==='narr'){S.cfg.narr=!S.cfg.narr;if(S.cfg.narr)S.cfg.sr=false}else if(o==='fs')S.cfg.fs=S.cfg.fs>16?16:20;else S.cfg[o]=!S.cfg[o];a11y();wDraw();const nb=w.querySelector(`[data-w="${k}"]`);if(nb)nb.focus();
  const lab=WOPTS.find(x=>x[0]===o)[1];const on=o==='fs'?S.cfg.fs>16:!!S.cfg[o];const msg=lab+(on?': ligado.':': desligado.');
  if(o==='narr'||o==='sr'){if(S.cfg.narr)narrar('Narração ligada.');else{calar();falarNav('Narração desligada. Seu leitor de tela continua funcionando.')}}else narrar(msg);say(msg);return}
 if(WBANDS[k]||k==='ajuste'||k==='menu'){W.st=k;W.heard='';wDraw();narrar(wSay());const f=w.querySelector('.band,.wo');if(f)f.focus()}}
render();welcome();
function openFromHash(){const h=location.hash.slice(1);if(!h.startsWith('ver-'))return;const k=KB.find(x=>x.id===h.slice(4));if(!k)return;
 let r=S.res[k.id];if(!r){r={id:'r'+Date.now(),kb:k.id,trecho:k.claim,prev:'',claim:k.claim,v:k.v,tema:k.tema,rep:false,onde:'',at:new Date()};S.res[k.id]=r;S.hist.unshift(r)}
 S.nav='mitos';openDetail(r.id)}
openFromHash();window.addEventListener('hashchange',openFromHash);

/* ---------- capacidades: ditado, IA, voz ---------- */
function webDict(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return null;let r=null;const cb={s:[],p:[],f:[]};const emit=(k,v)=>cb[k].forEach(f=>{try{f(v)}catch(e){}});
 return{start(){return new Promise((res,rej)=>{try{if(r){r._stop=true;try{r.abort()}catch(e){}}const x=new SR();r=x;x.lang='pt-BR';x.continuous=S.dictTarget==='sheet';x.interimResults=true;
   x.onstart=()=>emit('s',{state:'listening'});x.onerror=()=>{};
   x.onend=()=>{if(!x._stop&&S.dictTarget==='sheet'&&S.on){try{x.start();return}catch(e){}}emit('s',{state:'idle'})};
   x.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)emit('f',{text:t.trim()});else emit('p',{text:t})}};
   x.start();res()}catch(e){rej(e)}})},
  stop(){if(r){r._stop=true;try{r.stop()}catch(e){}}return Promise.resolve()},onState(f){cb.s.push(f)},onPartial(f){cb.p.push(f)},onFinal(f){cb.f.push(f)}}}
function wireDict(dd){if(!dd)return;S.dict=dd;
  dd.onState(({state})=>{S.dictOn=state==='listening';if(S.dictTarget==='wel'&&W&&state!=='listening'&&W.listen){W.listen=false;wDraw()}if(S.dictTarget==='sheet'&&$('#sheet').classList.contains('on'))openSheet();else if(S.dictTarget==='q'){const b=document.querySelector('[data-x=qmic]');if(b)b.classList.toggle('on',S.dictOn)}});
  dd.onPartial(({text})=>{if(S.dictTarget==='wel'){if(W){W.heard=text;const h=W.el.querySelector('.heard');if(h)h.textContent='Ouvi: “'+text+'”'}return}if(S.dictTarget==='ai'){const i=$('#ai');if(i)i.value=text;return}if(S.dictTarget==='q'){const q=$('#q');if(q)q.value=text;return}let l=S.lines[S.lines.length-1];if(!l||!l.p){l={text:'',p:1};S.lines.push(l)}l.text=text;drawTl()});
  dd.onFinal(({text})=>{if(S.dictTarget==='wel'){dd.stop().catch(()=>{});wVoice(text);return}if(S.dictTarget==='ai'){dd.stop().catch(()=>{});const i=$('#ai');if(i)i.value='';aAsk(text);return}if(S.dictTarget==='q'&&S.cfg.voz){const t=text.toLowerCase();const m={'início':'inicio','inicio':'inicio','aprender':'aprender','histórico':'historico','historico':'historico','configura':'config'};const hit=Object.keys(m).find(k=>/(abr|ir para|vai para|mostr)/.test(t)&&t.includes(k));if(hit){dd.stop().catch(()=>{});S.nav=m[hit];S.stack=[];render();say('Abrindo '+hit);return}}
  if(S.dictTarget==='q'){const q=$('#q');if(q){q.value=text;checkFlow(text)}dd.stop().catch(()=>{});return}const l=S.lines[S.lines.length-1];if(l&&l.p)S.lines.pop();sessionLine(text)});
  render()}
if(window.claude&&claude.use){
 claude.use('dictation').then(dd=>wireDict(dd||webDict())).catch(()=>wireDict(webDict()));
 claude.use('sample').then(s=>{if(s)S.sample=s}).catch(()=>{});
 claude.use('tts').then(t=>{if(t){S.tts=t;render()}}).catch(()=>{});
}else wireDict(webDict());
}
</script>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});</script>
